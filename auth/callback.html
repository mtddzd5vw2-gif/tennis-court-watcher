<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>認証 | Tennis Court Watcher</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <script src="../assets/config/auth-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"></script>
    <script src="../assets/js/auth-foundation.js" defer></script>
  </head>
  <body data-page="auth-callback">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../index.html">Tennis Court Watcher</a>
        <nav class="top-nav" aria-label="主要ナビゲーション">
          <a href="../index.html">空き状況</a>
          <a href="login.html">ログイン</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="status-card" aria-labelledby="callback-title">
        <p class="eyebrow">Authentication</p>
        <h1 id="callback-title">認証を確認しています</h1>
        <p class="lead" data-callback-status aria-live="polite">
          処理が終わるまで、この画面を閉じないでください。
        </p>
        <div class="button-row" data-callback-retry hidden>
          <a class="button" href="login.html">もう一度ログインする</a>
          <a class="button button--secondary" href="../index.html">空き状況へ戻る</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>© Tennis Court Watcher</span>
        <nav class="footer-links" aria-label="フッターナビゲーション">
          <a href="../legal/terms.html">利用規約</a>
          <a href="../legal/privacy.html">プライバシーポリシー</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
