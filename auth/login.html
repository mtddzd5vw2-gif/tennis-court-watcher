<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta
      name="description"
      content="Tennis Court Watcherのメールマジックリンクによるログイン・会員登録画面です。"
    >
    <title>ログイン・会員登録 | Tennis Court Watcher</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <script src="../assets/config/auth-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/dist/umd/supabase.js"></script>
    <script src="../assets/js/auth-foundation.js" defer></script>
  </head>
  <body data-page="auth-login">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="../index.html">Tennis Court Watcher</a>
        <nav class="top-nav" aria-label="主要ナビゲーション">
          <a href="../index.html">空き状況</a>
          <a href="../legal/terms.html">利用規約</a>
          <a href="../legal/privacy.html">プライバシー</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="auth-layout">
        <section aria-labelledby="page-title">
          <p class="eyebrow">会員ログイン</p>
          <h1 id="page-title">メールでログイン</h1>
          <p class="lead">
            メールアドレスに届くリンクからログインします。
            初めて利用する方は、同じ画面から会員登録できます。
          </p>
        </section>

        <section class="panel" aria-labelledby="form-title">
          <p
            class="notice"
            data-login-session-status
            aria-live="polite"
            role="status"
          >
            ログイン状態を確認しています…
          </p>
          <noscript>
            <style>
              [data-login-session-status] { display: none; }
            </style>
            <p class="notice">
              ログイン状態の確認とマジックリンクの送信にはJavaScriptが必要です。
              JavaScriptを有効にして、このページを再読み込みしてください。
            </p>
          </noscript>
          <p class="notice">
            マジックリンクは、原則としてこの画面を開いた同じブラウザで開いてください。
          </p>
          <h2 id="form-title" data-auth-form-title>ログイン用リンクを受け取る</h2>
          <form data-auth-form novalidate hidden>
            <div class="auth-mode-switch" aria-label="ログインまたは会員登録">
              <button
                class="auth-mode-button"
                type="button"
                data-auth-mode="login"
                aria-pressed="true"
              >
                ログイン
              </button>
              <button
                class="auth-mode-button"
                type="button"
                data-auth-mode="signup"
                aria-pressed="false"
              >
                初めての方
              </button>
            </div>
            <p class="session-guidance" data-auth-mode-guidance>
              登録済みのメールアドレスを入力してください。
            </p>
            <div class="field">
              <label for="email">メールアドレス</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                placeholder="name@example.com"
                required
              >
            </div>
            <div data-signup-consent hidden>
              <label class="consent" for="terms-consent">
                <input
                  id="terms-consent"
                  name="terms-consent"
                  type="checkbox"
                  disabled
                >
                <span>
                  <a href="../legal/terms.html">利用規約</a>と
                  <a href="../legal/privacy.html">プライバシーポリシー</a>
                  を確認し、利用規約に同意します。
                </span>
              </label>
            </div>
            <button
              class="button"
              type="submit"
              disabled
              aria-describedby="form-note persistent-session-note"
            >
              ログイン用リンクを送る
            </button>
            <p id="persistent-session-note" class="form-note session-note">
              共有端末では、利用後にログアウトしてください。
            </p>
            <p id="form-note" class="form-note" data-auth-form-note>
              有効なメールアドレスを入力すると送信できます。
            </p>
            <p class="status-text" data-form-status aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <span>© Tennis Court Watcher</span>
        <nav class="footer-links" aria-label="フッターナビゲーション">
          <a href="../index.html">空き状況へ戻る</a>
          <a href="../legal/terms.html">利用規約</a>
          <a href="../legal/privacy.html">プライバシーポリシー</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
