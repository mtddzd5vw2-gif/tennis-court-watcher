name: Update tennis availability
run-name: Update tennis availability [${{ github.event_name == 'schedule' && 'scheduled-live' || inputs.dry_run && 'manual-dry-run' || 'manual-live' }}]

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Acquire data and artifacts without commit, push, or Pages deployment
        type: boolean
        default: true
  schedule:
    # JST 07:07〜23:37 の30分おき（GitHub ActionsのcronはUTC）
    - cron: "7,37 0-14,22-23 * * *"

permissions:
  contents: read

concurrency:
  group: tennis-availability-writer
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.ENABLE_SCHEDULED_RUNS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      deploy_pages: ${{ steps.execution-mode.outputs.deploy_pages }}
      source_sha: ${{ steps.source-revision.outputs.sha }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Determine execution mode
        id: execution-mode
        shell: bash
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "deploy_pages=false" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy_pages=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Determine source ref
        id: source-ref
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "ref=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source-ref.outputs.ref }}

      - name: Record source revision
        id: source-revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest

      - name: Update availability
        run: python scripts/scrape.py

      - name: Match notification rules
        if: vars.ENABLE_NOTIFICATION_MATCHING == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python scripts/match_notification_rules.py
          --availability run-output/availability.json

      - name: Enqueue user email notifications
        if: >-
          vars.ENABLE_NOTIFICATION_MATCHING == 'true' &&
          vars.ENABLE_USER_EMAIL_ENQUEUE == 'true' &&
          env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python scripts/enqueue_email_notifications.py
          --availability run-output/availability.json

      - name: Dispatch user email notifications
        if: >-
          vars.ENABLE_USER_EMAIL_DISPATCH == 'true' &&
          env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EMAIL_DELIVERY_WORKER_SECRET: ${{ secrets.EMAIL_DELIVERY_WORKER_SECRET }}
        run: python scripts/dispatch_email_notifications.py

      - name: Upload run data and reservation page snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reservation-page-snapshots
          path: |
            snapshots
            run-output/availability.json
            index.html
            auth
            account
            legal
            assets
          if-no-files-found: warn
          retention-days: 7

      - name: Commit changed availability
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/availability.json; then
            echo "Availability is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/availability.json
            git commit -m "data: update tennis availability"

            MAX_PUSH_ATTEMPTS=3
            for attempt in $(seq 1 "${MAX_PUSH_ATTEMPTS}"); do
              echo "Push attempt ${attempt}/${MAX_PUSH_ATTEMPTS}."
              if push_output="$(git push 2>&1)"; then
                printf '%s\n' "${push_output}"
                echo "Data update commit pushed successfully."
                break
              fi

              printf '%s\n' "${push_output}"
              if ! grep -Eiq 'rejected|fetch first|non-fast-forward' <<< "${push_output}"; then
                echo "::error::Git push failed for a reason other than a concurrent update; not retrying."
                exit 1
              fi

              if [[ "${attempt}" -eq "${MAX_PUSH_ATTEMPTS}" ]]; then
                echo "::error::Git push was rejected after ${MAX_PUSH_ATTEMPTS} attempts."
                exit 1
              fi

              echo "::warning::Push was rejected by a concurrent update; rebasing the existing data commit onto origin/main."
              if ! git fetch origin main; then
                echo "::error::Failed to fetch origin/main before retrying the push."
                exit 1
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Rebase onto origin/main conflicted. The rebase was aborted; data files were not overwritten."
                exit 1
              fi

              sleep 2
            done
          fi

  deploy-pages:
    needs: update
    if: needs.update.result == 'success' && needs.update.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      AUTH_CALLBACK_URL: ${{ vars.AUTH_CALLBACK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.update.outputs.source_sha }}

      - name: Download run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reservation-page-snapshots
          path: run-artifact

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          mkdir -p _site/data
          cp run-artifact/index.html _site/index.html
          cp run-artifact/run-output/availability.json _site/data/availability.json
          cp -R run-artifact/auth _site/auth
          cp -R run-artifact/account _site/account
          cp -R run-artifact/legal _site/legal
          cp -R run-artifact/assets _site/assets

      - name: Generate public authentication configuration
        run: >-
          python scripts/generate_auth_config.py
          --output _site/assets/config/auth-config.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
